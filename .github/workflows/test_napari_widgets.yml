name: napari widgets

on:
  push:
    branches:
      - master
      - develop
      - main
      - bugfix/fix_napari_widgets_tests
  pull_request:
    branches:
      - '**'

concurrency:
  group: test-napari-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-latest-release:
    name: Test latest release ${{ matrix.qt_backend }}
    strategy:
      fail-fast: false
      matrix:
        qt_backend: ["PyQt6", "PySide6"]
        os: ["ubuntu-24.04"]
    uses: ./.github/workflows/base_test_workflow.yml
    with:
      python_version: "3.13"
      os: ${{ matrix.os }}
      napari: "napari70"
      qt_backend: ${{ matrix.qt_backend }}
      timeout: 10

  test-pyqt5:
    name: PyQt5 ${{ matrix.napari }}
    strategy:
      fail-fast: false
      matrix:
        napari: ["napari62"]
        qt_backend: ["PyQt5, PySide2"]
    uses: ./.github/workflows/base_test_workflow.yml
    with:
      python_version: "3.10"
      os: "ubuntu-24.04"
      napari: ${{ matrix.napari }}
      qt_backend: ${{ matrix.qt_backend }}
      timeout: 10
