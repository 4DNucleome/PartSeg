name: napari repo

on:
  schedule:
    - cron: '0 10 * * 1,3,5'  # every 24 hours
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/test_napari_repo.yml'
      - pyproject.toml
      - tox.ini

jobs:
  download_data:
    name: Download test data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - shell: bash
        run: bash build_utils/download_data.sh
      - name: Upload test data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test_data
          path: test_data
          retention-days: 5

  test_napari:
    name: ${{ matrix.napari_version }} ${{ matrix.qt_backend }} py${{ matrix.python }}
    runs-on: ${{ matrix.platform }}
    needs: download_data
    strategy:
      fail-fast: false
      matrix:
        platform: [ ubuntu-24.04 ]
        python: ['3.11', '3.12', '3.13', '3.14']
        napari_version: ['repo']
        qt_backend: ['PyQt6', 'PySide6']
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0
        with:
          qt: true
          wm: herbstluftwm

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install setuptools tox tox-gh-actions

      - name: Download test data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: test_data
          path: test_data

      - name: Test with tox
        # run tests using pip install --pre
        timeout-minutes: 60
        run: tox
        env:
          PLATFORM: ${{ matrix.platform }}
          NAPARI: ${{ matrix.napari_version }}
          BACKEND: ${{ matrix.qt_backend }}
          TOX_WORK_DIR: /tmp/tox
          PYVISTA_OFF_SCREEN: True  # required for opengl on windows
          PIP_CONSTRAINT: "requirements/version_denylist.txt"

      - name: Report Failures
        if: ${{ failure() }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5  # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          PYTHON: ${{ matrix.python }}
          BACKEND: ${{ matrix.qt_backend }}
          RUN_ID: ${{ github.run_id }}
          TITLE: '[test-bot] napari repos test fail'
        with:
          filename: .github/TEST_FAIL_TEMPLATE.md
          update_existing: true
