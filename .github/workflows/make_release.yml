name: Make release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/make_release.yml

jobs:
  build_wheels: # This job builds the wheels
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5  # v3.0.1
        with:
          attest-build-provenance-github: 'true'


  build_pyinstaller_bundle:
    name: Build PyInstaller bundle
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "windows-2022", "macos-15-intel", "macos-15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@b0bf9f57d62d2b3fee9f1c0e0c7e390f05e97a4e # v5.0.0
        with:
          qt: true
          wm: herbstluftwm

      - name: Install PartSeg
        run: python -m pip install --editable ".[pyinstaller]" --constraint requirements/constraints_py3.12.txt

      - name: Build PartSeg bundle
        run: python build_utils/create_and_pack_executable.py

      - name: Publish PartSeg bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: PartSeg_bundle_${{ matrix.os }}
          path: dist2

      - name: Test PartSeg bundle
        run: dist/PartSeg/PartSeg _test || dist/PartSeg/PartSeg _test || dist/PartSeg/PartSeg _test


  create_release:
    name: Create release
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write  # IMPORTANT: this permission is mandatory for create release
    needs:
      - build_wheels
      - build_pyinstaller_bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: 'PartSeg_bundle_*'
          path: pyinstaller
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: Packages
          path: dist
      - name: generate release notes
        id: release_notes
        run: |
          python build_utils/cut_changelog.py
          echo ------------------
          {
            echo 'contents<<EOF'
            python build_utils/cut_changelog.py
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: check if prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF/refs\/tags\/v/}"  # clean tag
          echo "tag=${TAG}" >> "$GITHUB_ENV"
        shell: bash

      - name: Create Release
        uses: "softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64"  # v3.0.3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref }}
          name: ${{ env.tag }}
          body: ${{ steps.release_notes.outputs.contents }}
          draft: false
          prerelease: ${{ contains(env.tag, 'rc') || contains(env.tag, 'a') || contains(env.tag, 'b')}}
          files: |
            dist/*
            pyinstaller/*

      - name: Publish package distributions to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 (v1.14.2)
