name: Tests

on:
  push:
    branches:
      - develop
      - feature_prepare/**
      - main

  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  COLUMNS: 120

jobs:
  actionlint:
    name: Action lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check workflow files
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -ignore SC2129
        shell: bash

  download_data:
    name: Download test data
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - shell: bash
        run: bash build_utils/download_data.sh
      - name: Upload test data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test_data
          path: test_data
          retention-days: 5

  base-test:
    name: Base py${{ matrix.python_version }}
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/base_test_workflow.yml
    needs: download_data
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.13", "3.14"]
        os: ["ubuntu-24.04"]
        qt_backend: ["PyQt6"]
        tox_args: [ "" ]
        include:
          - python_version: "3.11"
            os: "macos-15-intel"
            qt_backend: "PyQt5"
          - python_version: "3.12"
            os: "macos-15"
            qt_backend: "PyQt6"
          - python_version: "3.11"
            os: "windows-latest"
            qt_backend: "PyQt5"
          - python_version: "3.10"
            os: "ubuntu-22.04"
            qt_backend: "PySide2"
          - python_version: "3.10"
            os: "ubuntu-24.04"
            qt_backend: "PySide6"
          - python_version: "3.12"
            os: "ubuntu-22.04"
            qt_backend: "PyQt6"
    with:
      test_data: True
      python_version: ${{ matrix.python_version }}
      os: ${{ matrix.os }}
      qt_backend: ${{ matrix.qt_backend }}
      tox_args: ${{ matrix.tox_args }}

  base-test-main:
    name: Base py${{ matrix.python_version }}
    if: github.event_name == 'push'
    uses: ./.github/workflows/base_test_workflow.yml
    needs: download_data
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-24.04", "macos-15", "windows-2022"]
        qt_backend: ["PySide6", "PyQt6"]
        include:
          - python_version: "3.12"
            qt_backend: "PyQt5"
            os: "ubuntu-22.04"
          - python_version: "3.10"
            os: "ubuntu-22.04"
            qt_backend: "PySide2"
          - python_version: "3.11"
            os: "ubuntu-22.04"
            qt_backend: "PyQt6"
        exclude:
          - python_version: "3.11"
            qt_backend: "PySide2"
          - python_version: "3.12"
            qt_backend: "PySide2"
          - os: "macos-15"
            qt_backend: "PySide2"
          - python_version: "3.12"
            qt_backend: "PyQt6"
    with:
      test_data: True
      python_version: ${{ matrix.python_version }}
      os: ${{ matrix.os }}
      qt_backend: ${{ matrix.qt_backend }}
      artifact_suffix: "-main"
      pytest_args: "-v"

  test_coverage:
    needs: download_data
    uses: ./.github/workflows/base_test_workflow.yml
    strategy:
        fail-fast: false
        matrix:
          qt_backend: ["PyQt5", "PyQt6"]
    with:
      test_data: True
      python_version: "3.12"
      tox_args: "-e py312-${{ matrix.qt_backend }}-coverage"
      coverage: true
      qt_backend: ${{ matrix.qt_backend }}

  test_minimal:
    name: Test PartSeg minimal
    needs: download_data
    uses: ./.github/workflows/base_test_workflow.yml
    with:
      test_data: True
      python_version: "3.10"
      tox_args: "-e py310-PyQt5-minimal"
      coverage: true

  coverage_prepare:
    name: Prepare coverage
    runs-on: ubuntu-latest
    needs: [test_coverage, test_minimal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
          cache-dependency-path: pyproject.toml
          cache: 'pip'
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install codecov

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: cov-reports-*
          path: coverage
          merge-multiple: true
      - name: combine coverage data
        run: |
          python -Im coverage combine coverage
          python -Im coverage xml -o coverage.xml
          # Report and write to summary.
          python -Im coverage report --format=markdown --skip-empty --skip-covered >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage_xml
          path: coverage.xml
          retention-days: 5

      - name: Upload coverage data
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  test_conda:
    name: Test PartSeg conda
    runs-on: ubuntu-24.04
    needs: download_data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: "test-py313-pyside6"

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
        with:
          qt: true
          wm: herbstluftwm

      - name: Download test data
        uses: actions/download-artifact@v8
        with:
          name: test_data
          path: test_data

      - name: Run tests
        run: pixi run -e py313-pyside6-conda test

  check-package:
    name: Build & inspect our package.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5  # v3.0.1
