# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
min_version = 4.25
work_dir = {env:TOX_WORK_DIR:{tox_root}/.tox}
env_list =
    py{310-314}-{PyQt5,PyQt6,PySide6}-all
    py{311-314}-{PyQt6,PySide6}-napari_repo
    py{310-313}-{PyQt5,PyQt6}-napari_62
    py{310-314}-{PyQt5,PyQt6}-napari_70
    py{311-314}-{PyQt5,PyQt6}-napari_92
    py{312-313}-PySide6-napari_62
    py{312-314}-PySide6-napari_{70,92}
    # PySide2 is supported up to napari 0.6.6, the `all` env gets it from the `pyside2` extra
    py310-PySide2-{napari_62,all}

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
fail_on_no_env = True

[gh-actions:env]
NAPARI =
    latest: all
    napari62: napari_62
    napari70: napari_70
    napari92: napari_92
    repo: napari_repo
BACKEND =
    PyQt5: PyQt5
    PySide2: PySide2
    PyQt6: PyQt6
    PySide6: PySide6

[base]
report_args = --json-report --json-report-file={tox_root}/report-{env_name}-{sys_platform}.json

[testenv]
pass_env =
    QT_API
    CI
    GITHUB_ACTIONS
    AZURE_PIPELINES
    DISPLAY
    XAUTHORITY
    PYVISTA_OFF_SCREEN
deps =
    pytest-json-report
    pytest-pretty
    azure: pytest-azurepipelines
    napari_62: napari==0.6.2
    napari_70: napari==0.7.0
    napari_92: napari==0.9.2
    napari_repo: git+https://github.com/napari/napari.git
extras =
    test
    PyQt5: pyqt5
    PyQt6: pyqt6
    PySide2: pyside2
    PySide6: pyside6
commands =
    {all,azure}: python -m pytest {[base]report_args} {posargs}
    napari_{62,70,92}: python -m pytest -v {[base]report_args} {posargs:package/tests/test_PartSeg/test_napari_widgets.py}
    napari_repo: python -m pytest {[base]report_args} {posargs:package/tests}
    coverage: coverage run --concurrency=multiprocessing -m pytest {[base]report_args} {posargs}

[testenv:py310-PyQt5-minimal]
min_req = 1
set_env =
    MINIMAL_REQUIREMENTS=1
    PIP_CONSTRAINT=
    UV_CONSTRAINT=
deps =
    PyQt5!=5.15.0
    PyQt5-sip!=12.12.0
    imageio != 2.22.1
    pytest-json-report
    setuptools_scm[toml]>=3.4
    lxml_html_clean
extras =
    test
commands =
    coverage run -m pytest {[base]report_args} {posargs}

[testenv:pyinstaller-pre]
base_python = python3.14
skip_install = true
allowlist_externals =
    dist/PartSeg/PartSeg
    uv
commands_pre =
    uv pip compile --prerelease allow --python-version 3.14 --upgrade -o {env_tmp_dir}/requirements-pyinstaller-pre.txt pyproject.toml requirements/pre_test_problematic_version.txt --extra pyinstaller
    uv pip install -r {envtmpdir}/requirements-pyinstaller-pre.txt
    uv pip install --no-deps .
commands =
    python build_utils/create_and_pack_executable.py
commands_post =
    dist/PartSeg/PartSeg _test

[testenv:jupyter]
deps =
    {[testenv]deps}
    jupyter
    matplotlib
set_env =
    DATA_PATH = {tox_root}/typy_neuronow2
commands =
    jupyter nbconvert --to notebook --execute tutorials/tutorial_neuron_types/Neuron_types_example.ipynb

[testenv:docs]
deps =
    {[testenv]deps}
    -rrequirements/constraints_py3.12_docs.txt
allowlist_externals =
    make
    tar
extras =
    docs
    pyqt6
commands =
    make -C docs html
    tar -C docs/_build -czf docs.tar.gz html
